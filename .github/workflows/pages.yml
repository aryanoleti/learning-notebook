name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html styles.css config.js js data _site/

      # The key ends up in public JavaScript, so restrict it to this site's
      # address (HTTP referrer) in Google Cloud before adding the secret.
      - name: Write trial key from secret
        if: env.GEMINI_KEY != ''
        run: |
          node -e 'require("fs").writeFileSync("_site/config.js", "window.NOTEBOOK_CONFIG = " + JSON.stringify({ geminiKey: process.env.GEMINI_KEY }) + ";\n")'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
